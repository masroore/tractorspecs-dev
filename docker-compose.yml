services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scraper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      PGPASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-tractors}
      PGPORT: ${POSTGRES_PORT:-5432}
    networks:
        - webnet
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
        - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    networks:
        - webnet
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: '${MINIO_ACCESS_KEY}'
      MINIO_ROOT_PASSWORD: '${MINIO_SECRET_KEY}'
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_ADMIN_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/minio/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  adminer:
    networks:
        - webnet
    image: adminer:latest
    ports:
      - "89:8080"
    depends_on:
      - db
    restart: always

  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    image: tractorscraper:local
    env_file:
      - ./scraper/.env
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
        - webnet
    volumes:
      - ./json-data:/app/json-data
    command: ["python", "main.py"]
    restart: on-failure

volumes:
  db-data:
  minio-data:

networks:
    webnet:
        driver: bridge